  <g clip-path="url(#name-clip)"><text x="35" y="151" font-size="72" fill="#F0F4E7" font-weight="700" letter-spacing="-3.5">Adarsh P Baiju.</text></g>
  <g class="motion-rise" style="--delay:.3s"><text x="40" y="203" font-size="25" fill="#C7F464" >Python Backend Developer</text><text x="40" y="242" font-size="19" fill="#A9BE9A" >Django, REST APIs and PostgreSQL.</text></g>
  <g class="motion-rise" style="--delay:.55s"><rect x="40" y="287" width="108" height="34" rx="6" fill="#C7F464" /><text x="94" y="309" font-size="12" fill="#15271F" class="mono" text-anchor="middle">PYTHON</text><rect x="158" y="287" width="108" height="34" rx="6" fill="#1E3528" /><text x="212" y="309" font-size="12" fill="#C7F464" class="mono" text-anchor="middle">DJANGO</text><rect x="276" y="287" width="112" height="34" rx="6" fill="#1E3528" /><text x="332" y="309" font-size="12" fill="#C7F464" class="mono" text-anchor="middle">REST APIs</text></g>
  <g transform="translate(788 87)"><rect x="0" y="0" width="372" height="253" rx="14" fill="#102219" stroke="#405C3B"/><rect class="motion-border" x="0" y="0" width="372" height="253" rx="14"/><circle class="motion-pulse" cx="20" cy="23" r="4" fill="#C7F464"/><text x="34" y="27" font-size="11" fill="#A9BE9A" class="mono">REQUEST PIPELINE</text><path d="M0 46L372 46" stroke="#405C3B" fill="none"/>
  <text x="22" y="81" font-size="16" fill="#C7F464" class="mono">GET /api/projects</text><rect class="motion-cursor" x="210" y="66" width="8" height="18" fill="#C7F464"/>
  <rect x="22" y="104" width="328" height="50" rx="8" fill="#C7F464" /><text x="186" y="135" font-size="16" fill="#15271F" font-weight="700" text-anchor="middle">DJANGO</text>
