<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="232" viewBox="0 0 1200 232" role="img" aria-labelledby="title"><title id="title">Public GitHub dashboard</title><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:monospace;letter-spacing:1px}.pulse{animation:pulse 3s ease-in-out infinite}.flow{stroke-dasharray:8 12;animation:flow 4s linear infinite}.reveal{animation:reveal 1.2s ease-out both}@keyframes pulse{50%{opacity:.35}}@keyframes flow{to{stroke-dashoffset:-80}}@keyframes reveal{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.pulse,.flow,.reveal{animation:none}}</style><rect x="0" y="0" width="1200" height="232" rx="0" fill="#15271F" /><text x="30" y="32" font-size="11" fill="#C7F464" class="mono">GITHUB / PUBLIC ACTIVITY</text><text x="1170" y="32" font-size="9" fill="#A9BE9A" class="mono" text-anchor="end">UPDATED 2026-10-20 UTC</text><rect x="30" y="58" width="270" height="125" rx="12" fill="#1E3528" /><text x="50" y="90" font-size="9" fill="#A9BE9A" class="mono">PUBLIC REPOSITORIES</text><text x="50" y="149" font-size="43" fill="#F0F4E7" font-weight="700">18</text><rect x="320" y="58" width="270" height="125" rx="12" fill="#1E3528" /><text x="340" y="90" font-size="9" fill="#A9BE9A" class="mono">REPOSITORY STARS</text><text x="340" y="149" font-size="43" fill="#F0F4E7" font-weight="700">5</text><rect x="610" y="58" width="270" height="125" rx="12" fill="#1E3528" /><text x="630" y="90" font-size="9" fill="#A9BE9A" class="mono">FOLLOWERS</text><text x="630" y="149" font-size="43" fill="#F0F4E7" font-weight="700">6</text><rect x="900" y="58" width="270" height="125" rx="12" fill="#1E3528" /><text x="920" y="90" font-size="9" fill="#A9BE9A" class="mono">CONTRIBUTIONS / YEAR</text><text x="920" y="149" font-size="43" fill="#F0F4E7" font-weight="700">2,833</text><text x="30" y="211" font-size="10" fill="#A9BE9A" >Public GitHub statistics · refreshed automatically</text></svg>
