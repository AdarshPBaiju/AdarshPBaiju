<svg xmlns="http://www.w3.org/2000/svg" width="240" height="58" viewBox="0 0 240 58" role="img" aria-labelledby="title"><title id="title">CONTACT</title><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:monospace;letter-spacing:1px}.pulse{animation:pulse 3s ease-in-out infinite}.flow{stroke-dasharray:8 12;animation:flow 4s linear infinite}.reveal{animation:reveal 1.2s ease-out both}@keyframes pulse{50%{opacity:.35}}@keyframes flow{to{stroke-dashoffset:-80}}@keyframes reveal{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.pulse,.flow,.reveal{animation:none}}</style><rect x="0" y="0" width="240" height="58" rx="0" fill="#15271F" /><text x="120" y="36" font-size="13" fill="#C7F464" class="mono" text-anchor="middle">CONTACT</text></svg>
