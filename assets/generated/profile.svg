 <text x="54" y="153" font-size="18" fill="#A9BE9A" >Python backend developer based in Kerala, India.</text>
 <text x="54" y="183" font-size="18" fill="#A9BE9A" >Building web applications with Django and REST APIs.</text>
 <text x="54" y="227" font-size="18" fill="#C7F464" >Junior Python Developer</text>
 <text x="54" y="256" font-size="16" fill="#A9BE9A" >Yafei AI Technologies · November 2024 — Present</text>
 <text x="722" y="116" font-size="25" fill="#F0F4E7" font-weight="700">Current focus</text>
 <text x="722" y="155" font-size="17" fill="#A9BE9A" >System design and distributed systems</text>
 <text x="722" y="185" font-size="17" fill="#A9BE9A" >Microservices and backend architecture</text>
 <text x="722" y="229" font-size="11" fill="#C7F464" class="mono">PYTHON / DJANGO / REST APIs</text>
 <text x="722" y="262" font-size="11" fill="#A9BE9A" class="mono">CELERY / REDIS / POSTGRESQL</text>
</svg>
