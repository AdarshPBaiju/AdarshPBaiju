<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-labelledby="title"><title id="title">Primary languages across original public repositories</title><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:monospace;letter-spacing:1px}.pulse{animation:pulse 3s ease-in-out infinite}.flow{stroke-dasharray:8 12;animation:flow 4s linear infinite}.reveal{animation:reveal 1.2s ease-out both}@keyframes pulse{50%{opacity:.35}}@keyframes flow{to{stroke-dashoffset:-80}}@keyframes reveal{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.pulse,.flow,.reveal{animation:none}}</style><rect x="0" y="0" width="1200" height="170" rx="18" fill="#15271F" /><text x="30" y="31" font-size="11" fill="#C7F464" class="mono">LANGUAGE LANDSCAPE</text><text x="1170" y="31" font-size="9" fill="#A9BE9A" class="mono" text-anchor="end">PRIMARY LANGUAGE / NON-FORK REPOSITORIES</text><text x="30" y="66" font-size="13" fill="#F0F4E7" >Python</text><text x="370" y="66" font-size="10" fill="#A9BE9A" text-anchor="end">6 repos</text><rect x="30" y="76" width="340" height="5" rx="2" fill="#30472E" /><rect x="30" y="76" width="127.5" height="5" rx="2" fill="#C7F464" /><text x="420" y="66" font-size="13" fill="#F0F4E7" >TypeScript</text><text x="760" y="66" font-size="10" fill="#A9BE9A" text-anchor="end">5 repos</text><rect x="420" y="76" width="340" height="5" rx="2" fill="#30472E" /><rect x="420" y="76" width="106.25" height="5" rx="2" fill="#C7F464" /><text x="810" y="66" font-size="13" fill="#F0F4E7" >JavaScript</text><text x="1150" y="66" font-size="10" fill="#A9BE9A" text-anchor="end">2 repos</text><rect x="810" y="76" width="340" height="5" rx="2" fill="#30472E" /><rect x="810" y="76" width="42.5" height="5" rx="2" fill="#C7F464" /><text x="30" y="126" font-size="13" fill="#F0F4E7" >SCSS</text><text x="370" y="126" font-size="10" fill="#A9BE9A" text-anchor="end">1 repos</text><rect x="30" y="136" width="340" height="5" rx="2" fill="#30472E" /><rect x="30" y="136" width="21.25" height="5" rx="2" fill="#C7F464" /><text x="420" y="126" font-size="13" fill="#F0F4E7" >HTML</text><text x="760" y="126" font-size="10" fill="#A9BE9A" text-anchor="end">1 repos</text><rect x="420" y="136" width="340" height="5" rx="2" fill="#30472E" /><rect x="420" y="136" width="21.25" height="5" rx="2" fill="#C7F464" /><text x="810" y="126" font-size="13" fill="#F0F4E7" >CSS</text><text x="1150" y="126" font-size="10" fill="#A9BE9A" text-anchor="end">1 repos</text><rect x="810" y="136" width="340" height="5" rx="2" fill="#30472E" /><rect x="810" y="136" width="21.25" height="5" rx="2" fill="#C7F464" /></svg>
