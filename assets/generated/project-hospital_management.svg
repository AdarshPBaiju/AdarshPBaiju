<svg xmlns="http://www.w3.org/2000/svg" width="600" height="234" viewBox="0 0 600 234" role="img" aria-labelledby="title"><title id="title">Hospital Management</title><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:monospace;letter-spacing:1px}.pulse{animation:pulse 3s ease-in-out infinite}.flow{stroke-dasharray:8 12;animation:flow 4s linear infinite}.reveal{animation:reveal 1.2s ease-out both}@keyframes pulse{50%{opacity:.35}}@keyframes flow{to{stroke-dashoffset:-80}}@keyframes reveal{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.pulse,.flow,.reveal{animation:none}}</style><rect x="0" y="0" width="600" height="234" rx="0" fill="#15271F" /><text x="26" y="31" font-size="9" fill="#A9BE9A" class="mono">04 / SELECTED WORK</text><text x="571" y="35" font-size="25" fill="#C7F464" text-anchor="end">↗</text><text x="26" y="80" font-size="28" fill="#F0F4E7" font-weight="700" letter-spacing="-.8">Hospital Management</text><text x="26" y="113" font-size="15" fill="#A9BE9A" >Online patient bookings, doctor listings,</text><text x="26" y="136" font-size="15" fill="#A9BE9A" >specialties and hospital departments.</text><text x="26" y="174" font-size="9" fill="#C7F464" class="mono">PYTHON / DJANGO / APPOINTMENTS</text><path d="M26 193L574 193" stroke="#405C3B" fill="none"/><text x="26" y="216" font-size="9" fill="#A9BE9A" class="mono">Python · 0 STARS</text><text x="574" y="216" font-size="9" fill="#A9BE9A" class="mono" text-anchor="end">UPDATED 2024-05-29</text></svg>
