<svg xmlns="http://www.w3.org/2000/svg" width="600" height="374" viewBox="0 0 600 374" role="img" aria-labelledby="title"><title id="title">Job Portal</title><style>
text{font-family:Arial,'Segoe UI',sans-serif}.mono{font-family:Consolas,'Liberation Mono',monospace;letter-spacing:.8px}
.motion-rise{animation:motion-rise .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--delay,0s)}
.motion-number{animation:motion-rise 1s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--delay,0s)}
.motion-border{stroke-dasharray:70 900;animation:motion-border 9s linear infinite;fill:none;stroke:#C7F464;stroke-opacity:.38}
.motion-bar{transform-box:fill-box;transform-origin:left;animation:motion-bar 1.6s cubic-bezier(.2,.7,.2,1) both}
.motion-packet{stroke-dasharray:5 70;animation:motion-packet 3s linear infinite;fill:none;stroke:#C7F464;stroke-width:3}
.motion-cursor{animation:motion-cursor 1s steps(1) infinite}
.motion-orbit{transform-box:fill-box;transform-origin:center;animation:motion-orbit 8s linear infinite}
.motion-float{animation:motion-float 5s ease-in-out infinite;animation-delay:var(--delay,0s)}
.motion-pulse{animation:motion-pulse 4s ease-in-out infinite;animation-delay:var(--delay,0s)}
.motion-name{animation:motion-name 1.5s cubic-bezier(.2,.7,.2,1) both}
.scene-a{animation:scene-a 9s ease-in-out infinite}.scene-b{opacity:0;animation:scene-b 9s ease-in-out infinite}
.calendar-cell{transform-box:fill-box;transform-origin:center;animation:calendar-cell .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--delay,0s)}
.calendar-glow{animation:motion-pulse 5s ease-in-out infinite;animation-delay:var(--delay,0s)}
.calendar-scan{animation:calendar-scan 12s linear infinite}
@keyframes motion-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes motion-border{to{stroke-dashoffset:-970}}
@keyframes motion-bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes motion-packet{to{stroke-dashoffset:-150}}
@keyframes motion-cursor{50%{opacity:0}}
@keyframes motion-orbit{to{transform:rotate(360deg)}}
@keyframes motion-float{50%{transform:translateY(-3px)}}
@keyframes motion-pulse{50%{opacity:.6}}
@keyframes motion-name{from{width:0}to{width:740px}}
@keyframes scene-a{0%,40%,100%{opacity:1}48%,90%{opacity:0}}
@keyframes scene-b{0%,40%,100%{opacity:0}48%,90%{opacity:1}}
@keyframes calendar-cell{from{opacity:0;transform:scale(.35)}to{opacity:1;transform:scale(1)}}
@keyframes calendar-scan{from{transform:translateX(-100px)}to{transform:translateX(1130px)}}
@media(prefers-reduced-motion:reduce){.motion-rise,.motion-number,.motion-border,.motion-bar,.motion-packet,.motion-cursor,.motion-orbit,.motion-float,.motion-pulse,.motion-name,.scene-a,.scene-b,.calendar-cell,.calendar-glow,.calendar-scan{animation:none!important;transform:none}.motion-name{width:740px}.scene-a{opacity:1}.scene-b,.calendar-scan{display:none}.motion-rise,.motion-number,.motion-bar,.calendar-cell{opacity:1}}

text{font-family:'Trebuchet MS',Arial,sans-serif}
text[font-weight="700"]{font-family:Impact,'Arial Black',Arial,sans-serif;letter-spacing:.2px}
.mono{font-family:Consolas,'Liberation Mono',monospace;font-weight:700;letter-spacing:.6px}
.motion-border{stroke:#1B1B25;stroke-opacity:.5;stroke-width:2}
.motion-packet{stroke:#244BC4;stroke-width:4}
.motion-rise{animation-name:comic-pop}
.calendar-cell rect{stroke:#1B1B25;stroke-width:.8}
.comic-spark{transform-box:fill-box;transform-origin:center;animation:comic-spark 3s steps(2,end) infinite}
.comic-bubble{animation:comic-pop .7s cubic-bezier(.2,.8,.3,1.3) both;animation-delay:.3s}
@keyframes comic-pop{from{opacity:0;transform:translateY(9px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes comic-spark{50%{opacity:.5;transform:scale(.9)}}
@media(prefers-reduced-motion:reduce){.comic-spark,.comic-bubble{animation:none}}
</style><rect x="0" y="0" width="600" height="374" rx="0" fill="#FFF2D4" /><defs><pattern id="comic-dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#1B1B25" opacity=".11"/></pattern></defs><rect width="600" height="374" fill="url(#comic-dots)"/><path d="M505 1L545 1M520 9L560 9M535 17L575 17" stroke="#1B1B25" stroke-width="2" opacity=".18"/><text x="24" y="29" font-size="11" fill="#47444A" class="mono">03 / SELECTED WORK</text><text x="576" y="33" font-size="25" fill="#BD263C" text-anchor="end">↗</text><g class="motion-rise"><text x="24" y="72" font-size="30" fill="#1B1B25" font-weight="700" letter-spacing="-.8">Job Portal</text></g><rect x="28" y="99" width="552" height="128" rx="3" fill="#1B1B25"/><rect x="24" y="95" width="552" height="128" rx="3" fill="#FFFCF4" stroke="#1B1B25"/><rect x="38" y="109" width="5" height="5" rx="3" fill="#BD263C" /><rect x="48" y="109" width="5" height="5" rx="3" fill="#1B1B25" /><rect x="58" y="109" width="5" height="5" rx="3" fill="#1B1B25" /><path d="M24 123L576 123" stroke="#1B1B25" stroke-width="2" fill="none"/><g class="scene-a"><rect x="40" y="135" width="515" height="20" rx="3" fill="#FFFCF4" /><rect x="48" y="140" width="10" height="10" rx="3" fill="#1B1B25" /><rect x="72" y="142" width="190" height="5" rx="3" fill="#3158B7" /><rect x="451" y="140" width="90" height="10" rx="3" fill="#1B1B25" /><rect x="40" y="160" width="515" height="20" rx="3" fill="#FFFCF4" /><rect x="48" y="165" width="10" height="10" rx="3" fill="#1B1B25" /><rect x="72" y="167" width="245" height="5" rx="3" fill="#3158B7" /><rect x="451" y="165" width="90" height="10" rx="3" fill="#1B1B25" /><rect x="40" y="185" width="515" height="20" rx="3" fill="#FFFCF4" /><rect x="48" y="190" width="10" height="10" rx="3" fill="#1B1B25" /><rect x="72" y="192" width="300" height="5" rx="3" fill="#3158B7" /><rect x="451" y="190" width="90" height="10" rx="3" fill="#1B1B25" /></g><g class="scene-b"><rect x="40" y="135" width="515" height="20" rx="3" fill="#FFFCF4" /><rect x="48" y="140" width="10" height="10" rx="3" fill="#1B1B25" /><rect x="72" y="142" width="190" height="5" rx="3" fill="#3158B7" /><rect x="451" y="140" width="90" height="10" rx="3" fill="#1B1B25" /><rect x="40" y="160" width="515" height="20" rx="3" fill="#FFFCF4" /><rect x="48" y="165" width="10" height="10" rx="3" fill="#BD263C" /><rect x="72" y="167" width="245" height="5" rx="3" fill="#BD263C" /><rect x="451" y="165" width="90" height="10" rx="3" fill="#1B1B25" /><rect x="40" y="185" width="515" height="20" rx="3" fill="#FFFCF4" /><rect x="48" y="190" width="10" height="10" rx="3" fill="#1B1B25" /><rect x="72" y="192" width="300" height="5" rx="3" fill="#3158B7" /><rect x="451" y="190" width="90" height="10" rx="3" fill="#1B1B25" /></g><text x="563" y="117" font-size="11" fill="#47444A" class="mono" text-anchor="end">INTERFACE STUDY</text><text x="24" y="255" font-size="15" fill="#47444A" >Connecting employer job listings with candidates,</text><text x="24" y="279" font-size="15" fill="#47444A" >applications and authenticated dashboards.</text><text x="24" y="313" font-size="11" fill="#BD263C" class="mono">OPPORTUNITIES / APPLICATIONS</text><path d="M24 333L576 333" stroke="#1B1B25" stroke-width="2" fill="none"/><text x="24" y="358" font-size="11" fill="#47444A" class="mono">Python · 0 STARS</text><text x="576" y="358" font-size="11" fill="#47444A" class="mono" text-anchor="end">UPDATED 2024-08-10</text></svg>
