<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="135" viewBox="0 0 1200 135" role="img" aria-labelledby="title"><title id="title">Contact Adarsh P Baiju</title><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:monospace;letter-spacing:1px}.pulse{animation:pulse 3s ease-in-out infinite}.flow{stroke-dasharray:8 12;animation:flow 4s linear infinite}.reveal{animation:reveal 1.2s ease-out both}@keyframes pulse{50%{opacity:.35}}@keyframes flow{to{stroke-dashoffset:-80}}@keyframes reveal{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.pulse,.flow,.reveal{animation:none}}</style><rect x="0" y="0" width="1200" height="135" rx="0" fill="#15271F" /><text x="34" y="38" font-size="10" fill="#A9BE9A" class="mono">CONTACT</text><text x="32" y="88" font-size="36" fill="#F0F4E7" font-weight="700" letter-spacing="-1">Adarsh P Baiju.</text><rect x="1010" y="33" width="155" height="69" rx="12" fill="#C7F464" /><text x="1087" y="75" font-size="13" fill="#15271F" text-anchor="middle" font-weight="700">EMAIL ME ↗</text></svg>
