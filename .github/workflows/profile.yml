name: Profile assets

on:
  push:
    branches: [main]
    paths:
      - README.md
      - data/profile.json
      - scripts/**
      - assets/icons/**
      - .github/workflows/profile.yml
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm test
      - run: npm run build
      - run: npm run check

  refresh:
    needs: validate
    if: github.event_name != 'pull_request' && github.repository == 'AdarshPBaiju/AdarshPBaiju'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm run refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run check
      - name: Commit updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/generated assets/rendered data/github.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh public profile dashboard"
          git push origin HEAD:main
